<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendamento - Gaspalar Mobilia</title>
</head>
<body>

    <header>
        <h1>Agendamento Gaspalar Mobilia</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Agende seu atendimento</h2>

            <p>
                Preencha o formulário abaixo para solicitar um atendimento
                na Gaspalar Mobilia.
            </p>

            <form>

                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>

                <label for="produto">Produto de interesse:</label>
                <select
                    id="produto"
                    name="produto"
                    required
                >
                    <option value="">Selecione um produto</option>
                    <option value="detroit">Cadeira Detroit</option>
                    <option value="gaspalar">Cadeira Gaspalar</option>
                    <option value="curva">Cadeira Curva</option>
                    <option value="duna">Cadeira Duna</option>
                    <option value="mesa">Mesa laminada</option>
                </select>

                <br><br>

                <label for="data">Data do atendimento:</label>
                <input
                    type="date"
                    id="data"
                    name="data"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="[0-9]{2} [0-9]{5}-[0-9]{4}"
                    placeholder="(17) 99187-2495"
                    required
                >

                <br><br>

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <button type="submit">Agendar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Gaspalar Mobilia - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
